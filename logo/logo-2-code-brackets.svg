<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#180a2e"/>
      <stop offset="0.55" stop-color="#2a0f4e"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b3dff"/>
      <stop offset="0.5" stop-color="#ff3d81"/>
      <stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bg)"/>
  <rect x="8" y="8" width="184" height="184" rx="44" fill="none" stroke="url(#grad)" stroke-width="5"/>
  <rect x="20" y="20" width="160" height="160" rx="34" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.4"/>

  <g filter="url(#glow)">
    <path d="M44,60 L66,82 M66,82 L44,104"
          fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M156,60 L134,82 M134,82 L156,104"
          fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round"/>
    <path d="M70,58 L100,94 L130,58 M100,94 L100,146"
          fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M44,60 L66,82 M66,82 L44,104 M156,60 L134,82 M134,82 L156,104 M70,58 L100,94 L130,58 M100,94 L100,146"
        fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <circle cx="100" cy="160" r="3" fill="#ff9d2e"/>
</svg>
