<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.45" stop-color="#ff2d95"/>
      <stop offset="0.8" stop-color="#7b2dff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#badge)" filter="url(#glow)"/>
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#shine)"/>
  <rect x="16" y="16" width="168" height="168" rx="38" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <g>
    <path d="M74,62 L100,100 L126,62 M100,100 L100,142"
          fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
