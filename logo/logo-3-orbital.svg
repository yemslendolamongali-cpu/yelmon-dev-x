<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#1b2340"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00b8d9"/>
      <stop offset="1" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="ygrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c5ce7"/>
      <stop offset="1" stop-color="#00b8d9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#core)"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.8"/>

  <g filter="url(#glow)">
    <ellipse cx="100" cy="100" rx="96" ry="34" fill="none" stroke="#00b8d9" stroke-width="2.5" transform="rotate(-28 100 100)" opacity="0.9"/>
    <ellipse cx="100" cy="100" rx="96" ry="34" fill="none" stroke="#6c5ce7" stroke-width="2.5" transform="rotate(32 100 100)" opacity="0.9"/>
    <circle cx="195" cy="57" r="4" fill="#00e5ff"/>
    <circle cx="7" cy="92" r="4" fill="#ff3d81"/>
  </g>

  <g filter="url(#glow)">
    <path d="M72,62 L100,100 L128,62 M100,100 L100,142"
          fill="none" stroke="url(#ygrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M72,62 L100,100 L128,62 M100,100 L100,142"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
