<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <title>YELMON Dev X — Assistant de codage IA</title>
    <meta name="description" content="YELMON Dev X — Générez, analysez et optimisez votre code avec l'IA. Python, JavaScript, Java, Go, Rust, C++." />
    <meta name="theme-color" content="#ec4899" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YELMON" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="YELMON Dev X" />
    <meta name="msapplication-TileColor" content="#0a0a1a" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>
        /* Critical CSS — prevents FOUC */
        body {
            margin: 0;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #root {
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }
        /* Splash screen */
        #splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a1a;
            z-index: 9999;
            transition: opacity 0.4s;
        }
        #splash.hide { opacity: 0; pointer-events: none; }
        #splash .logo {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: conic-gradient(from 200deg, #a855f7, #ec4899, #f97316, #a855f7);
            display: grid; place-items: center;
            font-weight: 700; font-size: 32px; color: #fff;
            animation: spin 2s linear infinite;
            box-shadow: 0 0 40px #ec4899;
            margin-bottom: 20px;
        }
        #splash .name {
            font-family: system-ui, sans-serif;
            font-size: 22px; font-weight: 700; color: #fff;
            letter-spacing: 1px;
        }
        #splash .sub {
            font-family: system-ui, sans-serif;
            font-size: 11px; color: #888;
            letter-spacing: 3px; text-transform: uppercase;
            margin-top: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="splash">
        <div class="logo">Y</div>
        <div class="name">YELMON Dev X</div>
        <div class="sub">Loading...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
        /* Remove splash after React mounts */
        window.addEventListener('load', function() {
            setTimeout(function() {
                var s = document.getElementById('splash');
                if (s) { s.classList.add('hide'); setTimeout(function() { s.remove(); }, 500); }
            }, 800);
        });
    </script>
</body>
</html>
